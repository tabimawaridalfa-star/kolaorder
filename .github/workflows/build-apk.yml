name: Build KalaOrder APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug.keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build KalaOrder Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload KalaOrder APK
        uses: actions/upload-artifact@v4
        with:
          name: KalaOrder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
